<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Mockup POC ELGOS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: app shell — role switch on top, left nav per role, content as stacked panels. Visual base follows Desty's EWI mockup (nama lama) (clean, trust, brown heat scale). */
:root{
  --bg:#f7f7f5; --surface:#ffffff; --ink:#1d1f24; --muted:#5f6470; --line:#e4e2dd;
  --accent:#7a4a24; --accent-soft:#f3e9df; --link:#2f5bd3;
  --h1:#f6ede4; --h2:#e9cfb4; --h3:#d29d6c; --h4:#a8642f; --h5:#6e3a14;
  --ok:#1f7a4d; --ok-soft:#e3f3ea; --warn:#a15c00; --warn-soft:#fbefdc; --bad:#b3261e; --bad-soft:#fbe5e3;
  --info-soft:#e8eefc;
  --f-display:"Space Grotesk",system-ui,sans-serif; --f-body:"Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15161a; --surface:#1e2025; --ink:#ecebe7; --muted:#a3a6ad; --line:#33353c;
  --accent:#e0a97a; --accent-soft:#3a2b20; --link:#8fb0ff;
  --h1:#2b2420; --h2:#4d3626; --h3:#7c5232; --h4:#b8784a; --h5:#e7b48a;
  --ok:#6fd3a0; --ok-soft:#1d3a2c; --warn:#f0b864; --warn-soft:#3d2f17; --bad:#ff8a80; --bad-soft:#40201e; --info-soft:#1f2a44;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15161a; --surface:#1e2025; --ink:#ecebe7; --muted:#a3a6ad; --line:#33353c;
  --accent:#e0a97a; --accent-soft:#3a2b20; --link:#8fb0ff;
  --h1:#2b2420; --h2:#4d3626; --h3:#7c5232; --h4:#b8784a; --h5:#e7b48a;
  --ok:#6fd3a0; --ok-soft:#1d3a2c; --warn:#f0b864; --warn-soft:#3d2f17; --bad:#ff8a80; --bad-soft:#40201e; --info-soft:#1f2a44;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.brand{font-family:var(--f-display);font-weight:600;font-size:16px}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
.roles{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px;flex-wrap:wrap}
.roles button{border:0;background:transparent;color:var(--muted);font:500 13px var(--f-body);padding:6px 12px;border-radius:6px;cursor:pointer}
.roles button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.roles button:focus-visible,.nav a:focus-visible,.btn:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.shell{display:grid;grid-template-columns:220px 1fr;gap:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;max-width:1280px;margin:0 auto}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:12px 8px 4px}
.nav a{color:var(--ink);text-decoration:none;padding:7px 10px;border-radius:6px;display:flex;justify-content:space-between;gap:8px}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav a .tag{font-size:11px;color:var(--muted);font-weight:400}
main{min-width:0;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--f-display);font-size:24px;font-weight:600;margin:0;text-wrap:balance}
h2{font-size:15px;font-weight:600;margin:0}
.sub{color:var(--muted);margin:2px 0 0}
.crumb{font-size:12px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.panel>h2+p{margin:4px 0 12px;color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.kpi b{display:block;font-family:var(--f-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:13px}
.note{border-radius:8px;padding:10px 12px;font-size:13px;background:var(--info-soft)}
.note.warn{background:var(--warn-soft)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.mute{background:var(--bg);color:var(--muted);border:1px solid var(--line)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;color:var(--muted);border-bottom:1px solid var(--line);padding:8px 10px;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:9px 10px;vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.heat td.c{text-align:center;font-variant-numeric:tabular-nums;font-weight:600;min-width:64px}
.l1{background:var(--h1)} .l2{background:var(--h2)} .l3{background:var(--h3)} .l4{background:var(--h4);color:#fff} .l5{background:var(--h5);color:#fff}
.legend{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend i{width:18px;height:10px;border-radius:2px;display:inline-block}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.list{display:flex;flex-direction:column}
.item{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.item:last-child{border-bottom:0}
.item .t{font-weight:500}
.item .m{color:var(--muted);font-size:12.5px}
.btn{font:500 13px var(--f-body);border-radius:7px;padding:7px 12px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface)}
a.lnk{color:var(--link);text-decoration:none;font-size:13px} a.lnk:hover{text-decoration:underline}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.step{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg)}
.step b{display:block;font-size:13px}
.step span{font-size:12px;color:var(--muted)}
.step.cur{border-color:var(--accent);background:var(--accent-soft)}
.chat{display:flex;flex-direction:column;gap:10px;max-width:640px}
.msg{padding:10px 12px;border-radius:10px;max-width:85%}
.msg.ai{background:var(--accent-soft);align-self:flex-start}
.msg.me{background:var(--bg);border:1px solid var(--line);align-self:flex-end}
.avatar{display:flex;gap:12px;align-items:center}
.avatar .face{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 50% 38%,var(--h3) 0 22%,var(--h2) 23% 100%);flex:none}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mark{font-size:11px;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:2px 6px}
.ann{font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:6px 10px}
.soon{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px dashed var(--warn);color:var(--warn);background:var(--warn-soft);white-space:nowrap}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.scope{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding:8px 24px;border-bottom:1px solid var(--line);background:var(--surface)}
@media (max-width:900px){.shell{grid-template-columns:1fr}.nav{flex-direction:row;flex-wrap:wrap}.nav .grp{width:100%;margin:6px 4px 0}.grid2,.grid3,.split{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.ladder{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="brand">Elite Learning & Growth Operating System<small>POC ELGOS · Service Delivery L1 · Desember 2026 · data contoh</small></div>
  <div class="roles" role="group" aria-label="Lihat sebagai">
    <button id="r-hr" data-role="hr" aria-pressed="true">HR (Mas Abdan)</button>
    <button id="r-spv" data-role="spv" aria-pressed="false">Atasan (Team Lead)</button>
    <button id="r-emp" data-role="emp" aria-pressed="false">Karyawan (Dimas)</button>
    <button id="r-adm" data-role="adm" aria-pressed="false">Admin ETA</button>

</header>
<div class="scope" role="note">Mockup = janji cakupan live 2 Desember 2026. Yang belum ikut diberi label <span class="soon">Menyusul saat pilot</span> dan tidak bisa dipakai saat live.</div>

<div class="shell">

  <main id="main"></main>
</div>

const NAV = {
 hr:[['Ringkasan'],['hr-beranda','Beranda'],['DNA · hasil'],['hr-kamus','Kamus kompetensi'],['hr-library','Katalog materi'],['hr-program','Learning program'],['hr-karier','Gap per jenjang'],['TNA · AI'],['hr-tna','Target & wawancara'],['hr-plan','Training plan']],
 spv:[['Tim'],['spv-tim','Tim saya']],
 emp:[['Untuk Anda'],['emp-wawancara','Wawancara saya'],['emp-hasil','Hasil saya']],
 adm:[['Admin ETA'],['adm-tenant','Tenant & fitur']],
};
const roleOf = v => v.split('-')[0];
function render(){
  let v = (location.hash||'').slice(1); if(!V[v]) v='hr-beranda';
  const role = roleOf(v);
  document.querySelectorAll('.roles button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.role===role));
  document.getElementById('nav').innerHTML = NAV[role].map(n=> !V[n[0]] ? `<div class="grp">${n[0]}</div>` : `<a href="#${n[0]}" ${n[0]===v?'aria-current="page"':''}>${n[1]}</a>`).join('');
  document.getElementById('main').innerHTML = V[v]();
  window.scrollTo(0,0);
}
document.querySelectorAll('.roles button').forEach(b=>b.addEventListener('click',()=>{location.hash = NAV[b.dataset.role].find(n=>V[n[0]])[0]}));
addEventListener('hashchange',render); render();
</script>
