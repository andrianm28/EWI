# Lingkungan dev EWI yang bisa diakses publik, di luar AWS (keputusan user 11 Nov 2026: etavm1).
# Normalnya dideploy oleh pipeline (.github/workflows/deploy-dev.yml -> deploy.sh) dengan image dari GHCR:
#   EWI_API_IMAGE / EWI_WEB_IMAGE = ghcr.io/andrianm28/ewi-{api,web}:<sha>, EWI_ENV_FILE = /srv/ewi-dev/.env
# Jalan manual tanpa pipeline (build lokal):
#   cd deploy/dev-public && cp .env.example .env   # isi EWI_JWT_SECRET
#   docker compose up -d --build
# Data di sini data dev/dummy saja. Data karyawan nyata hanya di prod.
name: ewi-dev

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file: ${EWI_ENV_FILE:-.env}   # POSTGRES_PASSWORD
    environment:
      POSTGRES_USER: ewi
      POSTGRES_DB: ewi_dev
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ewi -d ewi_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: ${EWI_API_IMAGE:-ewi-dev-api:latest}
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    # Secret (POSTGRES_PASSWORD, EWI_JWT_SECRET, ELITEMENTOR_*, DEV_SEED_PASSWORD) dibaca dari .env;
    # API gagal start bila EWI_JWT_SECRET kosong/pendek (B22).
    env_file: ${EWI_ENV_FILE:-.env}
    environment:
      NODE_ENV: development
      EWI_ENV: dev
      PORT: 4100
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ewi_dev
      DB_USER: ewi
      DB_SSL: "false"         # Postgres lokal di jaringan compose, tanpa TLS
      DB_SCHEMA: ewi
      RUN_MIGRATIONS: "true"
      EWI_JWT_AUDIENCE: ewi
      EWI_JWT_ISSUER: ewi-api-dev
      CORS_ORIGIN: ${PUBLIC_URL:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4100/api/health | grep -q '\"ok\"'"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

  web:
    image: ${EWI_WEB_IMAGE:-ewi-dev-web:latest}
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"   # hanya lokal; publik lewat nginx host (TLS) di etavm1

volumes:
  db-data:
