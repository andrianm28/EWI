# WebSocket hanya bila klien meminta upgrade; permintaan biasa tetap keep-alive.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      '';
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 20m;

  location /api/ {
    proxy_pass http://api:4100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
  }

  # Suara live (B19): WS /api/voice/sessions/:id/stream. Sesi wawancara bisa puluhan menit.
  location /api/voice/ {
    proxy_pass http://api:4100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # EM-LTI: "EliteMentor (simulasi)" di stack dev-worktree (service em-sim). Resolver Docker + variabel: nginx tetap
  # start walau service em-sim tidak ada (stack lain); permintaannya saja yang 502.
  location /em-sim/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $em_sim http://em-sim:4300;
    proxy_pass $em_sim;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
