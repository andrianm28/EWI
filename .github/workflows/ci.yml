name: CI

# Gate merge (keputusan P2, 4 Nov): unit + lint + type-check + e2e Playwright di setiap PR.
# Push ke main menjalankan CI lewat deploy.yml (workflow_call), sebelum deploy staging.
on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ewi
          POSTGRES_PASSWORD: ewi
          POSTGRES_DB: ewi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ewi" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://ewi:ewi@localhost:5432/ewi_test
      DB_SCHEMA: ewi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint -w apps/api
      - name: Migrasi naik, turun, naik lagi
        run: |
          npm run migrate -w apps/api
          (cd apps/api && npx sequelize-cli db:migrate:undo:all)
          npm run migrate -w apps/api
      - run: npm test -w apps/api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint -w apps/web
      - run: npm run build -w apps/web

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run e2e -w apps/web

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.13.4 }
      - name: terraform fmt
        run: terraform fmt -recursive -check infra
      - name: terraform validate (tanpa backend/kredensial)
        run: |
          for d in bootstrap live/shared live/staging live/prod; do
            echo "::group::$d"
            terraform -chdir=infra/$d init -backend=false -input=false
            terraform -chdir=infra/$d validate
            echo "::endgroup::"
          done
      - name: Cek skrip + compose deploy VPS
        run: |
          for f in deploy/vps/*.sh deploy/vps/ops/*.sh deploy/dev-worktree/*.sh; do bash -n "$f"; done
          shellcheck -x deploy/vps/*.sh deploy/vps/ops/*.sh deploy/dev-worktree/*.sh
          ELGOS_ENV=staging ELGOS_ENV_FILE="$PWD/deploy/vps/.env.example" ELGOS_DB_ENV_FILE="$PWD/deploy/vps/db.env.example" ELGOS_API_IMAGE=a ELGOS_WEB_IMAGE=w \
            PUBLIC_URL=https://contoh WEB_PORT=8181 docker compose -f deploy/vps/docker-compose.yml config -q
          ACME_EMAIL=ci@example.com docker compose -f deploy/vps/proxy/docker-compose.yml config -q
      - name: Build image API
        run: docker build -f apps/api/Dockerfile -t elgos-api:ci .
      - name: Build image web (dev publik)
        run: docker build -f apps/web/Dockerfile -t elgos-web:ci .
