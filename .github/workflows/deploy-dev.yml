name: Deploy dev

# DIUBAH 23 Nov 2026 (audit PR): etavm1 tidak boleh dipakai lagi (aturan project: dev, staging, prod hanya
# di VPS etavm2). Job deploy ke runner self-hosted etavm1 dihapus. Push ke `dev` kini hanya menjalankan
# gate CI penuh dan membangun image api + web ke GHCR (tag = SHA commit dan `dev`). Deploy dev ke etavm2
# ditambahkan oleh thread infra bila dibutuhkan; sampai itu ada, dev berjalan per worktree di etavm2
# (deploy/dev-worktree, docs/infra/vps-etavm2.md). Spek: docs/designs/audit-23nov-etavm1.md.
on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # nama image GHCR wajib huruf kecil
  IMAGE_PREFIX: ghcr.io/andrianm28/ewi

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build dan push image api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }},${{ env.IMAGE_PREFIX }}-api:dev
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build dan push image web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }},${{ env.IMAGE_PREFIX }}-web:dev
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
