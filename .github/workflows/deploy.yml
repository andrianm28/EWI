name: Deploy

# staging: otomatis setiap push ke main (setelah PR di-merge).
# prod:    manual (Actions > Deploy > Run workflow) dengan image_tag = SHA yang sudah jalan di
#          staging, sehingga image yang sama dipromosikan. Pasang reviewer wajib di
#          Settings > Environments > prod. Pilot ELGOS jalan di prod (R2-4).
# dev tidak di AWS: berjalan di etavm1 (deploy/dev-public).
# Workflow ini diam (skip) sampai variabel repo AWS_ACCOUNT_ID diisi; lihat docs/infra/aws-staging-prod.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Lingkungan tujuan
        type: choice
        options: [staging, prod]
        default: staging
      image_tag:
        description: SHA commit yang image-nya sudah ada di ECR (kosong = build dari commit terpilih)
        required: false
        default: ''

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  ECR_REPO: elgos-api
  TF_IN_AUTOMATION: 'true'

jobs:
  deploy:
    if: vars.AWS_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment || 'staging' }}
      url: ${{ steps.web.outputs.url }}
    env:
      TARGET: ${{ inputs.environment || 'staging' }}
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.image_tag || github.sha }}

      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }

      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.13.4, terraform_wrapper: false }

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/elgos-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build dan push image API (lewati bila tag sudah ada)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          PROMOTE: ${{ inputs.image_tag }}
        run: |
          if aws ecr describe-images --repository-name "$ECR_REPO" --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "Image $ECR_REPO:$IMAGE_TAG sudah ada, dipakai ulang."
          elif [ -n "$PROMOTE" ]; then
            echo "::error::Image $ECR_REPO:$IMAGE_TAG belum ada di ECR. Deploy SHA itu ke staging dulu."
            exit 1
          else
            docker build -f apps/api/Dockerfile -t "$REGISTRY/$ECR_REPO:$IMAGE_TAG" .
            docker push "$REGISTRY/$ECR_REPO:$IMAGE_TAG"
          fi

      - name: terraform apply (infra + API; migrasi jalan saat container start)
        working-directory: infra/live/${{ env.TARGET }}
        run: |
          terraform init -input=false -backend-config="bucket=elgos-tfstate-${{ vars.AWS_ACCOUNT_ID }}"
          terraform apply -input=false -auto-approve -var "image_tag=$IMAGE_TAG"
          {
            echo "WEB_URL=$(terraform output -raw web_url)"
            echo "WEB_BUCKET=$(terraform output -raw web_bucket)"
            echo "DISTRIBUTION_ID=$(terraform output -raw distribution_id)"
          } >> "$GITHUB_ENV"

      - name: Build dan unggah web
        id: web
        run: |
          npm ci
          VITE_API_BASE_URL=/api npm run build -w apps/web
          aws s3 sync apps/web/dist "s3://$WEB_BUCKET" --delete \
            --exclude index.html --cache-control "public,max-age=31536000,immutable"
          aws s3 cp apps/web/dist/index.html "s3://$WEB_BUCKET/index.html" --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/index.html" "/"
          echo "url=$WEB_URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS "$WEB_URL/api/health" && exit 0
            sleep 10
          done
          echo "::error::$WEB_URL/api/health tidak sehat"
          exit 1
