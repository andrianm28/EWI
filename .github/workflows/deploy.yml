name: Deploy staging/prod

# Staging dan prod ELGOS di VPS etavm2 (keputusan user 17 Nov 2026; AWS hanya untuk KMS + SES).
#
#   push ke main     -> CI penuh -> build image GHCR (tag = SHA) -> deploy staging
#   Run workflow     -> pilih staging/prod + SHA image yang sudah ada di GHCR (promosi image yang
#                       sama dengan staging). Prod lewat GitHub environment `prod` (penyetuju wajib).
# Pengaman (PK-10, PD-6/PD-11 opsi A): deploy hanya dari branch main; SHA yang dipromosikan harus
# commit di main; environment prod hanya menerima main + penyetuju. Alur: docs/infra/alur-rilis.md.
# Deploy jalan di runner self-hosted etavm2 (label etavm2,elgos; koneksi keluar saja) lewat
# deploy/vps/deploy.sh: backup DB -> migrasi -> ganti container -> health check, gagal = rollback.
# Detail dan setup VM: docs/infra/vps-etavm2.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Lingkungan tujuan
        type: choice
        options: [staging, prod]
        default: staging
      image_tag:
        description: SHA image di GHCR (kosong = build commit terpilih; wajib untuk prod)
        required: false
        default: ''
      seed:
        description: Seed data demo (hanya staging; mereset data demo)
        type: boolean
        default: false

concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/andrianm28/ewi   # nama image GHCR huruf kecil, sama dengan pipeline dev

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Hanya dari branch main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Deploy hanya boleh dijalankan dari branch main (sekarang ${{ github.ref }})."
          exit 1
      - name: Prod wajib memakai image yang sudah ada
        if: inputs.environment == 'prod' && inputs.image_tag == ''
        run: |
          echo "::error::Deploy prod wajib mengisi image_tag (SHA yang sudah lolos di staging)."
          exit 1
      - uses: actions/checkout@v4
        if: inputs.image_tag != ''
        with: { fetch-depth: 0 }
      - name: SHA harus berasal dari main
        if: inputs.image_tag != ''
        env:
          TAG: ${{ inputs.image_tag }}
        run: |
          [[ "$TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::image_tag harus SHA commit lengkap (40 karakter)"; exit 1; }
          git merge-base --is-ancestor "$TAG" origin/main \
            || { echo "::error::$TAG bukan commit di main; image dari branch lain tidak boleh dipromosikan."; exit 1; }

  ci:
    needs: guard
    if: inputs.image_tag == '' || github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  images:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    needs: [guard, images]
    # always(): tetap jalan saat promosi image yang sudah ada (ci + images di-skip), tidak bila gagal
    if: >-
      always() && needs.guard.result == 'success' && github.ref == 'refs/heads/main' &&
      (needs.images.result == 'success' || (inputs.image_tag != '' && needs.images.result == 'skipped'))
    runs-on: [self-hosted, etavm2, elgos]
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment || 'staging' }}
      url: ${{ (inputs.environment == 'prod' && 'https://elgos.eliteacademy.id') || 'https://stg-elgos.eliteacademy.id' }}
    permissions:
      contents: read
      packages: read
    env:
      TAG: ${{ inputs.image_tag || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.image_tag || github.sha }}
      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
      - name: Deploy
        env:
          ELGOS_ENV: ${{ inputs.environment || 'staging' }}
          SEED: ${{ inputs.seed && 'force' || 'auto' }}
        run: deploy/vps/deploy.sh "$TAG"
      - name: Logout GHCR
        if: always()
        run: docker logout "$REGISTRY"
